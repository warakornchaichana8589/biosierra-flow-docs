<script>
const PAGES = [{"id": "weighing", "label": "ใบตวงสาร", "html": "<!DOCTYPE html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Flow ใบตวงสาร — ก่อนมา / หลังผ่าน QC<\/title>\n<style>\n  :root{\n    --bg:#f6f7f9; --ink:#1f2933; --muted:#5f6b7a; --line:#c9d0d9;\n    --sales:#e8590c; --rd:#7048e8; --pur:#1c7ed6; --wh:#2b8a3e; --qc:#d6336c; --prod:#0c8599; --qa:#9c36b5;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Sarabun\",\"Noto Sans Thai\",\"Leelawadee UI\",system-ui,sans-serif;font-size:15px;line-height:1.5}\n  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}\n  h1{font-size:24px;margin:0 0 4px}\n  .sub{color:var(--muted);margin:0 0 20px}\n  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}\n  .tag{display:inline-block;font-size:12px;font-weight:600;color:#fff;border-radius:999px;padding:2px 10px;white-space:nowrap}\n  .sales{background:var(--sales)} .rd{background:var(--rd)} .pur{background:var(--pur)} .wh{background:var(--wh)}\n  .qc{background:var(--qc)} .prod{background:var(--prod)} .qa{background:var(--qa)}\n\n  .phase{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}\n  .phase-title{font-size:19px;margin:0 0 14px}\n  section{background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px;margin-bottom:8px}\n\n  .tracks{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n  .track-h{font-weight:700;margin:0 0 10px;font-size:15px}\n  .col{display:flex;flex-direction:column;align-items:stretch}\n\n  .node{position:relative;background:#fff;border:1.5px solid var(--line);border-left-width:6px;border-radius:10px;padding:10px 12px}\n  .node.b-sales{border-left-color:var(--sales)} .node.b-rd{border-left-color:var(--rd)} .node.b-pur{border-left-color:var(--pur)}\n  .node.b-wh{border-left-color:var(--wh)} .node.b-qc{border-left-color:var(--qc)} .node.b-prod{border-left-color:var(--prod)} .node.b-qa{border-left-color:var(--qa)}\n  .node .t{font-weight:700}\n  .node .m{font-size:13px;color:var(--muted);margin-top:2px}\n  .node .m code{background:#f1f3f5;border-radius:4px;padding:0 4px;font-size:12px}\n  .node .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}\n  .node .note{margin-top:6px;font-size:13px;background:#fff8e6;border:1px solid #ffe08a;border-radius:6px;padding:4px 8px}\n  .node .gate{margin-top:6px;font-size:13px;background:#e7f5ff;border:1px solid #a5d8ff;border-radius:6px;padding:4px 8px}\n  .node .warn{margin-top:6px;font-size:13px;background:#fff0f0;border:1px solid #ffc9c9;border-radius:6px;padding:4px 8px}\n\n  .arrow{height:26px;position:relative;margin:0 auto;width:2px;background:var(--line)}\n  .arrow::after{content:\"\";position:absolute;left:-6px;bottom:-2px;border:7px solid transparent;border-top:9px solid var(--line);border-bottom:0}\n\n  .merge{display:flex;justify-content:center;margin:6px 0 2px}\n  .merge .bar{width:52%;height:22px;border:2px solid var(--line);border-top:0;border-radius:0 0 14px 14px}\n\n  .focus{border:2.5px solid #f08c00;background:#fff9db;box-shadow:0 0 0 4px #fff3bf}\n  .focus .t{font-size:17px}\n\n  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px}\n  .pill{display:inline-block;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px;margin-bottom:6px}\n  .pass{background:#d3f9d8;color:#2b8a3e} .fail{background:#ffe3e3;color:#c92a2a}\n  .loop{font-size:13px;color:#c92a2a;margin-top:8px;font-weight:600}\n\n  .here{display:inline-block;background:#f08c00;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n  .foot{margin-top:24px;font-size:13px;color:var(--muted)}\n  .foot li{margin-bottom:4px}\n  @media (max-width:760px){.tracks,.split{grid-template-columns:1fr}.merge .bar{width:80%}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <h1>Flow ใบตวงสาร (ชั่งตวงสาร)<\/h1>\n  <p class=\"sub\">ก่อนมาถึงใบตวงสาร มีอะไรมาก่อน → QC ทวนสอบ → ผ่านแล้วไปไหนต่อ · เมนูอ้างอิง dev (biosierra-backoffice.cbr-dev.com) · 3 พ.ย. 2569<\/p>\n\n  <div class=\"legend\">\n    <span class=\"tag sales\">ฝ่ายขาย<\/span><span class=\"tag rd\">R&amp;D<\/span><span class=\"tag pur\">จัดซื้อ<\/span>\n    <span class=\"tag wh\">คลังสินค้า<\/span><span class=\"tag qc\">QC<\/span><span class=\"tag prod\">ฝ่ายผลิต<\/span><span class=\"tag qa\">QA<\/span>\n  <\/div>\n\n  <!-- ───────── ก่อนมา ───────── -->\n  <p class=\"phase\">ช่วงที่ 1<\/p>\n  <section>\n    <h2 class=\"phase-title\">ก่อนมาถึงใบตวงสาร — 2 เส้นทางต้องพร้อมทั้งคู่<\/h2>\n    <div class=\"tracks\">\n      <!-- เส้น A เอกสาร/สูตร -->\n      <div class=\"col\">\n        <p class=\"track-h\">A. เอกสาร + สูตร → ได้ \"คำสั่งผลิต (SO)\"<\/p>\n        <div class=\"node b-sales\"><div class=\"t\">CR Form → ใบเสนอราคา<\/div><div class=\"m\">ฝ่ายขาย → <code>CR Form<\/code>, <code>ใบเสนอราคา<\/code><\/div><div class=\"tags\"><span class=\"tag sales\">ฝ่ายขาย<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-rd\"><div class=\"t\">สูตร / BOM → Test Run → Product Spec<\/div><div class=\"m\">R&amp;D → <code>สูตร / BOM<\/code>, <code>Test Run<\/code>, <code>Product Spec<\/code><\/div><div class=\"tags\"><span class=\"tag rd\">R&amp;D<\/span><span class=\"tag qc\">QC ลงนาม Test Run<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-sales\"><div class=\"t\">ใบส้ม (FM-PD-21)<\/div><div class=\"m\">ฝ่ายขาย → <code>ใบส้ม<\/code> · อนุมัติ 4 ระดับ + บัญชียืนยันรับมัดจำ<\/div><div class=\"tags\"><span class=\"tag sales\">ฝ่ายขาย<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-prod\"><div class=\"t\">คำสั่งผลิต (SO) + BOM จากสูตร<\/div><div class=\"m\">ฝ่ายผลิต → <code>คำสั่งผลิต (SO)<\/code>, <code>ปฏิทินการผลิต<\/code>, <code>แผนผลิต<\/code><\/div><div class=\"tags\"><span class=\"tag prod\">ฝ่ายผลิต / Planning<\/span><\/div>\n          <div class=\"gate\">BOM ของ SO นี้แหละที่ใบตวงสารดึงไปเติมรายการวัตถุดิบ + ค่ามาตรฐานต่อถังให้อัตโนมัติ<\/div><\/div>\n      <\/div>\n\n      <!-- เส้น B วัตถุดิบ -->\n      <div class=\"col\">\n        <p class=\"track-h\">B. วัตถุดิบ (RM) → มาถึงห้องผลิต<\/p>\n        <div class=\"node b-pur\"><div class=\"t\">ใบขอซื้อ (PR) → ใบสั่งซื้อ (PO)<\/div><div class=\"m\">จัดซื้อ → <code>ใบขอซื้อ (PR)<\/code>, <code>ใบสั่งซื้อ (PO)<\/code><\/div><div class=\"tags\"><span class=\"tag pur\">จัดซื้อ<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-wh\"><div class=\"t\">รับเข้าสินค้า (GR) → เข้า Quarantine<\/div><div class=\"m\">คลังสินค้า → <code>รับเข้าสินค้า (GR)<\/code><\/div><div class=\"tags\"><span class=\"tag wh\">คลัง<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-qc\"><div class=\"t\">QC ตรวจรับ → หัวหน้า QC อนุมัติ<\/div><div class=\"m\">QC → <code>ตรวจรับ<\/code> · ผ่าน = Lot Released · ไม่ผ่าน = Blocked<\/div><div class=\"tags\"><span class=\"tag qc\">QC<\/span><span class=\"tag qc\">หัวหน้า QC<\/span><\/div><\/div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-wh\"><div class=\"t\">ใบเบิก → จ่ายเข้าห้องผลิต<\/div><div class=\"m\">คลังสินค้า → <code>ใบเบิก<\/code> · เบิกได้เฉพาะ Lot ที่ Released (FIFO) + อนุมัติใบเบิก<\/div><div class=\"tags\"><span class=\"tag wh\">คลัง<\/span><span class=\"tag prod\">ฝ่ายผลิตขอเบิก<\/span><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"merge\"><div class=\"bar\"><\/div><\/div>\n    <div class=\"arrow\"><\/div>\n\n    <!-- ใบตวงสาร -->\n    <div class=\"node focus b-wh\">\n      <div class=\"t\">สร้างใบตวงสาร <span class=\"here\">คุณอยู่ตรงนี้<\/span><\/div>\n      <div class=\"m\">คลังสินค้า → <code>ใบตวงสาร (ชั่งตวงสาร)<\/code> → ปุ่มสร้าง · URL <code>/warehouse/weighing<\/code><\/div>\n      <div class=\"m\">เลือก SO → ระบบเติมวัตถุดิบจาก BOM (สารรวม 1) + Lot/รอบของ SO → กรอกน้ำหนักที่ชั่งได้ต่อถัง, เครื่องชั่ง, ลำดับการผสม, น้ำหนักรวมภาชนะ (บังคับ) → บันทึก<\/div>\n      <div class=\"tags\"><span class=\"tag wh\">คลัง<\/span><span class=\"tag prod\">ฝ่ายผลิต<\/span><\/div>\n      <div class=\"note\">ระบบเทียบกับค่ามาตรฐานให้ทุกแถว (เกณฑ์เริ่มต้น ±2%) — ถ้าเกินเกณฑ์จะเตือนตั้งแต่ตอนบันทึกว่า \"QC จะทวนสอบไม่ผ่าน\"<\/div>\n      <div class=\"warn\">ระบบยังไม่ได้ผูกใบตวงสารกับ Lot ที่เบิกจากคลัง และไม่ได้เช็คว่าเบิกของแล้วหรือยัง — เส้น B ต้องทำให้ครบตามขั้นตอนเอง<\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"arrow\"><\/div>\n\n  <!-- ───────── QC ทวนสอบ ───────── -->\n  <p class=\"phase\">ช่วงที่ 2<\/p>\n  <section>\n    <h2 class=\"phase-title\">QC ทวนสอบใบตวงสาร (สถานะ \"รอ QC ทวนสอบ\")<\/h2>\n    <div class=\"node b-qc\">\n      <div class=\"t\">QC เปิดใบ → ติ๊ก \"ลำดับการผสมถูกต้อง\" → ตัดสิน<\/div>\n      <div class=\"m\">หน้าเดิม <code>/warehouse/weighing?tab=pending<\/code> → ไอคอนดินสอ → ส่วน \"QC ทวนสอบ\" · หรือเข้าจากการ์ด \"ใบตวงรอทวนสอบ\" บนแดชบอร์ด QC<\/div>\n      <div class=\"tags\"><span class=\"tag qc\">QC / หัวหน้า QC / admin<\/span><\/div>\n      <div class=\"note\">ผู้ที่บันทึกใบนั้นทวนสอบใบของตัวเองไม่ได้ ต้องให้ QC อีกคนเป็นผู้ทวนสอบ<\/div>\n    <\/div>\n    <div class=\"split\">\n      <div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-qc\"><span class=\"pill pass\">ทวนสอบผ่าน<\/span>\n          <div class=\"t\">เทลงเครื่องผสมได้<\/div>\n          <div class=\"m\">กดได้เฉพาะเมื่อทุกแถวอยู่ในเกณฑ์<\/div>\n          <div class=\"m\">↓ ไปช่วงที่ 3<\/div><\/div>\n      <\/div>\n      <div>\n        <div class=\"arrow\"><\/div>\n        <div class=\"node b-qc\"><span class=\"pill fail\">ไม่ผ่านการทวนสอบ<\/span>\n          <div class=\"t\">ต้องใส่เหตุผล → เปิด NCR เข้ากล่องงานของ QA<\/div>\n          <div class=\"m\">ใบนี้ล็อก แก้ไม่ได้ · QA → <code>NCR<\/code><\/div>\n          <div class=\"tags\"><span class=\"tag qa\">QA<\/span><\/div>\n          <div class=\"loop\">↺ ชั่งใหม่เป็นใบตวงสารใบใหม่ (Lot/รอบเดิม) → กลับไปรอ QC ทวนสอบ<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"arrow\"><\/div>\n\n  <!-- ───────── หลังผ่าน ───────── -->\n  <p class=\"phase\">ช่วงที่ 3<\/p>\n  <section>\n    <h2 class=\"phase-title\">ผ่านแล้วไปไหนต่อ<\/h2>\n    <div class=\"col\">\n      <div class=\"node b-prod\"><div class=\"t\">1. ติ๊กรอบผสมของห้องผสม<\/div><div class=\"m\">ฝ่ายผลิต → <code>แผนผลิต<\/code> (<code>/production/plan<\/code>)<\/div><div class=\"tags\"><span class=\"tag prod\">ฝ่ายผลิต<\/span><\/div>\n        <div class=\"gate\">ด่าน: ห้องผสมเพิ่มรอบได้เมื่อใบตวงสารทวนสอบผ่านแล้ว<\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-prod\"><div class=\"t\">2. บันทึกผลิต (FM-PD-17) + Loss<\/div><div class=\"m\">ฝ่ายผลิต → <code>บันทึกผลิต<\/code>, <code>Loss Monitor<\/code><\/div><div class=\"tags\"><span class=\"tag prod\">ฝ่ายผลิต<\/span><\/div>\n        <div class=\"gate\">ด่าน: SO ที่ยังมีใบตวงสารที่ไม่ผ่านการทวนสอบ จะบันทึกผลิตไม่ได้<\/div>\n        <div class=\"warn\">ช่องโหว่: SO ที่ไม่มีใบตวงสารเลยยังบันทึกผลิตได้ (ระบบนับเฉพาะใบที่ยังไม่ผ่าน)<\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-qc\"><div class=\"t\">3. QC ตรวจระหว่างผลิต (Bulk / ระหว่างบรรจุ)<\/div><div class=\"m\">QC → <code>ตรวจระหว่างผลิต<\/code> (<code>/qc/in-process<\/code>) · ไม่ผ่าน → NCR<\/div><div class=\"tags\"><span class=\"tag qc\">QC<\/span><\/div>\n        <div class=\"warn\">ตอนนี้ผลไม่ผ่านไม่ได้ไปกันการปล่อย Batch (ยังรอตัดสินว่าจะบล็อกหรือไม่)<\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-wh\"><div class=\"t\">4. รับ FG เข้าคลัง → ได้ FG Lot สถานะ \"รอ QC\" (Quarantine)<\/div><div class=\"m\">คลังสินค้า → <code>รับ FG เข้าคลัง<\/code> · เลือก SO ที่ยังไม่ปิด + ผูกสูตร · เลข Lot ระบบออกให้<\/div><div class=\"tags\"><span class=\"tag wh\">คลัง<\/span><\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-qc\"><div class=\"t\">5. QC ตรวจ FG → หัวหน้า QC อนุมัติ → QC Passed<\/div><div class=\"m\">QC → <code>สถานะ Lot<\/code> → คิว FG → สร้าง/เปิดใบตรวจ FG · ไม่ผ่าน = FG Hold/Blocked<\/div><div class=\"tags\"><span class=\"tag qc\">QC<\/span><span class=\"tag qc\">หัวหน้า QC (คนละคนกับผู้เสนอ)<\/span><\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-qa\"><div class=\"t\">6. QA ปล่อย Batch → Released / Available<\/div><div class=\"m\">QA → <code>ปล่อย Batch<\/code> · QC Passed ยังขาย/จองไม่ได้จนกว่า QA จะปล่อย<\/div><div class=\"tags\"><span class=\"tag qa\">QA<\/span><\/div><\/div>\n      <div class=\"arrow\"><\/div>\n      <div class=\"node b-wh\"><div class=\"t\">7. ใบเหลือง (FM-PD-20) → ใบส่งของ (DO) → ส่งลูกค้า<\/div><div class=\"m\">ฝ่ายผลิต → <code>ใบเหลือง<\/code> · คลังสินค้า → <code>ใบส่งของ (DO)<\/code> · หยิบได้เฉพาะ Lot ที่ QA ปล่อยแล้ว (FIFO)<\/div><div class=\"tags\"><span class=\"tag prod\">ฝ่ายผลิต<\/span><span class=\"tag wh\">คลัง<\/span><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <ul class=\"foot\">\n    <li>ช่องสีฟ้า = ด่านที่ระบบบังคับจริง (เช็คจากโค้ด API) · ช่องสีแดง = ช่องโหว่ที่ระบบยังไม่กัน<\/li>\n    <li>เมนูใบตวงสารเห็นเฉพาะบัญชีที่มีสิทธิ์คลังสินค้าหรือฝ่ายผลิต — ถ้าบัญชี QC มองไม่เห็นเมนู ให้เข้า URL ตรง หรือเพิ่มสิทธิ์ดูคลังให้บทบาท QC<\/li>\n    <li>ลำดับช่วงที่ 1 และขั้นที่ 7 อ้างอิงแผนภาพ End-to-End Process Flow (ปรับปรุง 30 ต.ค. 2569)<\/li>\n  <\/ul>\n<\/div>\n<\/body>\n<\/html>\n"}, {"id": "disposition", "label": "Disposition (Lot ไม่ผ่าน)", "html": "<!DOCTYPE html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>เส้นทาง Lot ไม่ผ่าน — ก่อนและหลัง Disposition<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg: #f4f6f9; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #d9dee7;\n    --brand: #0aa5d0; --brand-soft: #e3f5fb;\n    --wh: #7c5cff; --wh-soft: #efeaff;\n    --qc: #0aa5d0; --qa: #e0882b; --qa-soft: #fdf1e3;\n    --ok: #1f9d55; --ok-soft: #e5f6ec;\n    --bad: #d64545; --bad-soft: #fde9e9;\n    --warn: #c98a00; --warn-soft: #fff5d6;\n    --rj: #8a1c1c; --rj-soft: #f6dede;\n  }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink);\n    font-family: \"Noto Sans Thai\", \"Leelawadee UI\", Tahoma, sans-serif; font-size: 15px; line-height: 1.55; }\n  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 56px; }\n  header h1 { margin: 0 0 4px; font-size: 26px; }\n  header p { margin: 0; color: var(--muted); }\n  .toc { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }\n  .toc a { text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line);\n    padding: 6px 14px; border-radius: 999px; font-weight: 500; }\n  .toc a b { color: var(--brand); margin-right: 6px; }\n  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-top: 22px; }\n  section > h2 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 10px; }\n  section > h2 .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;\n    background: var(--brand); color: #fff; font-size: 15px; }\n  section > .sub { color: var(--muted); margin: 0 0 20px; }\n\n  /* lanes */\n  .lanes { display: grid; grid-template-columns: 1fr 1.25fr; gap: 22px; }\n  .lane { border: 1px dashed var(--line); border-radius: 14px; padding: 16px; background: #fbfcfe; }\n  .lane h3 { margin: 0 0 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }\n  .lane h3 .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--ink); color: #fff; }\n\n  .step { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--brand);\n    border-radius: 10px; padding: 10px 14px; }\n  .step.wh { border-left-color: var(--wh); }\n  .step.qc { border-left-color: var(--qc); }\n  .step.qa { border-left-color: var(--qa); }\n  .step.prod { border-left-color: #5b6475; }\n  .step.goal { border: 2px solid var(--qa); border-left-width: 2px; background: var(--qa-soft); text-align: center; font-weight: 600; }\n  .step.done { border: 2px solid var(--ok); border-left-width: 2px; background: var(--ok-soft); text-align: center; font-weight: 600; }\n  .step .who { font-size: 12px; font-weight: 600; letter-spacing: .2px; }\n  .step.wh .who { color: var(--wh); } .step.qc .who { color: var(--qc); } .step.qa .who { color: var(--qa); }\n  .step.prod .who { color: #5b6475; }\n  .step .what { font-weight: 600; }\n  .step .menu { font-size: 12.5px; color: var(--muted); }\n  .step .note { font-size: 13px; color: var(--muted); margin-top: 2px; }\n\n  .down { text-align: center; color: #9aa3b2; font-size: 18px; line-height: 1; padding: 5px 0; }\n  .down small { display: block; font-size: 12px; color: var(--muted); }\n\n  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n  .split3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  .br { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }\n  .br .lbl { font-size: 12px; font-weight: 700; display: block; margin-bottom: 2px; }\n  .br.pass { background: var(--ok-soft); border: 1px solid #bfe6cf; }\n  .br.pass .lbl { color: var(--ok); }\n  .br.fail { background: var(--bad-soft); border: 1px solid #f3c4c4; }\n  .br.fail .lbl { color: var(--bad); }\n  .br.warn { background: var(--warn-soft); border: 1px solid #f1dc9a; }\n  .br.warn .lbl { color: var(--warn); }\n\n  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px;\n    border: 1px solid transparent; white-space: nowrap; vertical-align: 1px; }\n  .c-pend { background: var(--warn-soft); color: var(--warn); border-color: #f1dc9a; }\n  .c-pass { background: var(--brand-soft); color: #08799a; border-color: #b8e4f2; }\n  .c-rel { background: var(--ok-soft); color: var(--ok); border-color: #bfe6cf; }\n  .c-hold { background: var(--bad-soft); color: var(--bad); border-color: #f3c4c4; }\n  .c-rj { background: var(--rj-soft); color: var(--rj); border-color: #e7b4b4; }\n\n  .need { margin-top: 10px; font-size: 13px; background: var(--qa-soft); border: 1px solid #f3d3ad;\n    border-radius: 10px; padding: 8px 12px; }\n  .need b { color: var(--qa); }\n\n  .merge { margin-top: 18px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 22px; text-align: center; }\n  .merge div { color: #9aa3b2; font-size: 18px; }\n\n  /* part 2 */\n  .center { max-width: 640px; margin: 0 auto; }\n  .gate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n\n  /* part 3 */\n  .outcomes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }\n  .oc { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }\n  .oc .hd { padding: 10px 14px; font-weight: 700; color: #fff; }\n  .oc .hd small { display: block; font-weight: 500; opacity: .9; font-size: 12px; }\n  .oc .bd { padding: 12px 14px; font-size: 13.5px; flex: 1; }\n  .oc .bd ol { margin: 0; padding-left: 18px; }\n  .oc .bd li { margin-bottom: 4px; }\n  .oc .ft { padding: 8px 14px; font-size: 12.5px; font-weight: 600; border-top: 1px solid var(--line); background: #fafbfd; }\n  .h-claim { background: #3a7bd5; } .h-rework { background: #7c5cff; } .h-reject { background: #b23b3b; }\n  .h-end { background: #4b5566; }\n  .loop { color: var(--rj); } .newlot { color: #6a4ce0; } .end { color: var(--ok); }\n\n  table { width: 100%; border-collapse: collapse; font-size: 14px; }\n  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }\n  th { background: #f7f9fc; font-size: 13px; color: var(--muted); font-weight: 600; }\n\n  .legend { display: flex; flex-wrap: wrap; gap: 14px 22px; font-size: 13.5px; }\n  .legend span { display: inline-flex; gap: 6px; align-items: center; }\n  .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }\n\n  .notes { margin: 0; padding-left: 20px; }\n  .notes li { margin-bottom: 6px; }\n  footer { margin-top: 18px; color: var(--muted); font-size: 12.5px; }\n  code { font-size: 12px; background: #eef1f6; padding: 1px 5px; border-radius: 4px; }\n\n  @media (max-width: 900px) {\n    .lanes, .merge, .outcomes { grid-template-columns: 1fr; }\n    .merge div:first-child { display: none; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<header>\n  <h1>เส้นทางของ Lot ที่ไม่ผ่าน — ก่อนและหลัง Disposition<\/h1>\n  <p>BioSierra ERP · ไล่จากโค้ดระบบจริง ณ 2 พ.ย. 2569<\/p>\n  <nav class=\"toc\">\n    <a href=\"#before\"><b>1<\/b>ก่อนเข้า Disposition<\/a>\n    <a href=\"#decide\"><b>2<\/b>ตัดสินแล้วไปไหน<\/a>\n    <a href=\"#after\"><b>3<\/b>ปลายทางแต่ละแบบ<\/a>\n    <a href=\"#legend\"><b>i<\/b>สีและสถานะ<\/a>\n  <\/nav>\n<\/header>\n\n<!-- ───────────── 1 ───────────── -->\n<section id=\"before\">\n  <h2><span class=\"n\">1<\/span>ก่อนเข้า Disposition — ของมาถึงคิวได้ยังไง<\/h2>\n  <p class=\"sub\">มี 2 ทาง: วัตถุดิบ/บรรจุภัณฑ์ที่ซื้อเข้ามา (RM/PK) และสินค้าสำเร็จรูปที่ผลิตเอง (FG)<\/p>\n\n  <div class=\"lanes\">\n    <!-- RM / PK -->\n    <div class=\"lane\">\n      <h3><span class=\"tag\">RM / PK<\/span>วัตถุดิบ · บรรจุภัณฑ์<\/h3>\n\n      <div class=\"step wh\">\n        <div class=\"who\">คลัง<\/div>\n        <div class=\"what\">รับของจากผู้ขาย<\/div>\n        <div class=\"menu\">เมนู คลัง › รับเข้าสินค้า (GR)<\/div>\n        <div class=\"note\">ของเข้าโซนกักรอตรวจ (WH-QZ) <span class=\"chip c-pend\">รอตรวจ<\/span><\/div>\n      <\/div>\n      <div class=\"down\">↓<\/div>\n\n      <div class=\"step qc\">\n        <div class=\"who\">QC<\/div>\n        <div class=\"what\">ตรวจรับ<\/div>\n        <div class=\"menu\">เมนู QC › ตรวจรับ<\/div>\n      <\/div>\n      <div class=\"down\">↓<\/div>\n\n      <div class=\"split\">\n        <div class=\"br pass\"><span class=\"lbl\">✓ ผ่าน<\/span>ย้ายเข้าคลัง WH-RM / WH-PK <span class=\"chip c-rel\">ใช้ได้<\/span><br>→ เบิกไปผลิตได้ จบ<\/div>\n        <div class=\"br fail\"><span class=\"lbl\">✗ ไม่ผ่าน<\/span>ย้ายเข้าคลังของเสีย WH-RJ <span class=\"chip c-rj\">ไม่ผ่าน<\/span><\/div>\n      <\/div>\n\n      <div class=\"need\"><b>ไม่ต้องเปิด NCR<\/b> — Lot ที่ไม่ผ่านขึ้นคิว Disposition แท็บ RM/PK ให้ทันที<\/div>\n    <\/div>\n\n    <!-- FG -->\n    <div class=\"lane\">\n      <h3><span class=\"tag\">FG<\/span>สินค้าสำเร็จรูป<\/h3>\n\n      <div class=\"step prod\">\n        <div class=\"who\">ฝ่ายผลิต → คลัง<\/div>\n        <div class=\"what\">ผลิตเสร็จ คลังรับเข้า ได้เลข FG Lot<\/div>\n        <div class=\"menu\">เมนู คลัง › รับ FG เข้าคลัง<\/div>\n        <div class=\"note\">เช่น SS001-001-261102-2 <span class=\"chip c-pend\">รอ QC<\/span><\/div>\n      <\/div>\n      <div class=\"down\">↓<\/div>\n\n      <div class=\"step qc\">\n        <div class=\"who\">QC<\/div>\n        <div class=\"what\">บันทึกผลตรวจ FG<\/div>\n        <div class=\"menu\">เมนู QC › สถานะ Lot<\/div>\n      <\/div>\n      <div class=\"down\">↓<\/div>\n      <div class=\"split\">\n        <div class=\"br pass\"><span class=\"lbl\">✓ ผ่าน<\/span><span class=\"chip c-pass\">QC ผ่าน<\/span> แต่ยังส่งของไม่ได้ ต้องรอ QA<\/div>\n        <div class=\"br fail\"><span class=\"lbl\">✗ ไม่ผ่าน<\/span><span class=\"chip c-hold\">Hold<\/span> ไปรอ Disposition<\/div>\n      <\/div>\n      <div class=\"down\">↓ <small>เฉพาะที่ QC ผ่าน<\/small><\/div>\n\n      <div class=\"step qa\">\n        <div class=\"who\">QA<\/div>\n        <div class=\"what\">ปล่อย Batch<\/div>\n        <div class=\"menu\">เมนู QA › ปล่อย Batch<\/div>\n      <\/div>\n      <div class=\"down\">↓<\/div>\n      <div class=\"split\">\n        <div class=\"br pass\"><span class=\"lbl\">✓ ปล่อย<\/span><span class=\"chip c-rel\">ปล่อยแล้ว<\/span> ส่งของ (DO) ได้ จบ<\/div>\n        <div class=\"br fail\"><span class=\"lbl\">✗ ไม่ปล่อย<\/span><span class=\"chip c-hold\">Hold<\/span> ไปรอ Disposition<\/div>\n      <\/div>\n\n      <div class=\"down\">+<\/div>\n      <div class=\"br warn\"><span class=\"lbl\">⚠ อีกทาง: Recall<\/span>\n        เมื่อ Recall อนุมัติ (QA › ข้อร้องเรียน / Recall) Lot ที่ยังไม่ Hold จะถูกเปลี่ยนเป็น <span class=\"chip c-hold\">Hold<\/span> หมด\n        ไม่ว่าตอนนั้นจะ รอ QC / QC ผ่าน หรือปล่อยแล้วก็ตาม<\/div>\n\n      <div class=\"need\"><b>ต้องมี NCR ก่อนกดตัดสิน<\/b> — Lot ที่ Hold ขึ้นคิวแท็บ FG ทันที แต่ QA จะกดตัดสินได้ก็ต่อเมื่อมี NCR ของ Lot นั้นที่ยังเปิดอยู่ (QA › NCR)<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"merge\"><div>↓<\/div><div>↓<\/div><\/div>\n  <div class=\"center\">\n    <div class=\"step goal\">คิว Disposition &nbsp;·&nbsp; เมนู QA › Disposition<\/div>\n  <\/div>\n<\/section>\n\n<!-- ───────────── 2 ───────────── -->\n<section id=\"decide\">\n  <h2><span class=\"n\">2<\/span>ตัดสินแล้วไปไหน<\/h2>\n  <p class=\"sub\">QA ตัดสินเท่านั้น ส่วนการย้ายของหรือตัดสต๊อกเป็นงานของคลัง<\/p>\n\n  <div class=\"center\">\n    <div class=\"step qa\">\n      <div class=\"who\">QA<\/div>\n      <div class=\"what\">กดตัดสิน เลือกการจัดการ + จำนวน + เหตุผล<\/div>\n      <div class=\"menu\">เมนู QA › Disposition<\/div>\n    <\/div>\n    <div class=\"down\">↓<\/div>\n\n    <div class=\"gate\">\n      <div class=\"br warn\"><span class=\"lbl\">เลือก \"ทำลาย\" หรือ \"รับแบบมีเงื่อนไข\" และคนกดไม่ใช่ QA Manager<\/span>\n        ต้องรอ <b>QA Manager อนุมัติ<\/b> ก่อน<\/div>\n      <div class=\"br pass\"><span class=\"lbl\">การจัดการอื่น (หรือ QA Manager ตัดสินเอง)<\/span>\n        ไปขั้นถัดไปเลย<\/div>\n    <\/div>\n    <div class=\"down\">↓<\/div>\n\n    <div class=\"step wh\">\n      <div class=\"who\">คลัง<\/div>\n      <div class=\"what\">กด \"ดำเนินการ\" ระบบย้ายหรือตัดสต๊อกตามที่ QA ตัดสิน<\/div>\n      <div class=\"menu\">เมนู คลัง › งานจาก QA<\/div>\n      <div class=\"note\">คืนผู้ขาย / ขอของทดแทน ต้องกรอกเลขเอกสารอ้างอิง · ทำลาย ต้องแนบใบรับรองการทำลาย<\/div>\n    <\/div>\n    <div class=\"down\">↓<\/div>\n\n    <div class=\"step done\">ใบตัดสินเป็น \"เสร็จ\"<\/div>\n    <p style=\"text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0\">ยกเลิกใบได้ทุกขั้นจนกว่าใบจะเป็น \"เสร็จ\"<\/p>\n  <\/div>\n<\/section>\n\n<!-- ───────────── 3 ───────────── -->\n<section id=\"after\">\n  <h2><span class=\"n\">3<\/span>ปลายทางของแต่ละการจัดการ<\/h2>\n  <p class=\"sub\">หลังคลังดำเนินการเสร็จ<\/p>\n\n  <div class=\"outcomes\">\n    <div class=\"oc\">\n      <div class=\"hd h-claim\">คืนผู้ขาย / ขอของทดแทน<small>RM / PK<\/small><\/div>\n      <div class=\"bd\"><ol>\n        <li>คลังตัดของออกจาก WH-RJ<\/li>\n        <li>ระบบ<b>เปิดเคลมผู้ขายให้เอง<\/b>ตั้งแต่ตอนอนุมัติ<\/li>\n        <li>ขอของทดแทน: ของใหม่เข้าทางรับเข้าสินค้า (GR) แล้วตรวจรับตามปกติ<\/li>\n      <\/ol><\/div>\n      <div class=\"ft\">ตามต่อที่ QA › เคลมผู้ขาย<\/div>\n    <\/div>\n\n    <div class=\"oc\">\n      <div class=\"hd h-rework\">Rework<small>FG<\/small><\/div>\n      <div class=\"bd\"><ol>\n        <li>คลังตัดของออกจาก WH-FG ส่งกลับฝ่ายผลิต<\/li>\n        <li>ฝ่ายผลิตทำใหม่<\/li>\n        <li>คลังรับเข้าที่ \"รับ FG เข้าคลัง\" แบบรับจาก Rework<\/li>\n        <li>ได้ <b>FG Lot ใหม่<\/b> ต้องผ่าน QC และ QA ปล่อยใหม่ทั้งหมด<\/li>\n      <\/ol><\/div>\n      <div class=\"ft newlot\">↺ กลับไปเริ่มที่ข้อ 1 (ทาง FG) ด้วย Lot ใหม่<\/div>\n    <\/div>\n\n    <div class=\"oc\">\n      <div class=\"hd h-reject\">Reject<small>FG · ต้องทั้ง Lot<\/small><\/div>\n      <div class=\"bd\"><ol>\n        <li>คลังย้ายทั้ง Lot จาก WH-FG ไป WH-RJ<\/li>\n        <li>สถานะเป็น <span class=\"chip c-rj\">Reject<\/span><\/li>\n        <li>Lot <b>กลับเข้าคิว Disposition<\/b> ตัดสินรอบสอง เลือกได้แค่ \"ทำลาย\"<\/li>\n      <\/ol><\/div>\n      <div class=\"ft loop\">↺ กลับไปข้อ 2 → ทำลาย<\/div>\n    <\/div>\n\n    <div class=\"oc\">\n      <div class=\"hd h-end\">ทำลาย / รับแบบมีเงื่อนไข<small>ทำลาย: ทุกชนิด · รับแบบมีเงื่อนไข: RM/PK<\/small><\/div>\n      <div class=\"bd\"><ol>\n        <li><b>ทำลาย<\/b>: คลังตัดของออก แนบใบรับรองการทำลาย<\/li>\n        <li><b>รับแบบมีเงื่อนไข<\/b> (ทั้ง Lot): ย้ายจาก WH-RJ กลับเข้าคลังจัดเก็บ ใช้ผลิตได้ Lot ถูกติดเลขใบตัดสินไว้ให้รู้ว่ารับแบบมีเงื่อนไข<\/li>\n      <\/ol><\/div>\n      <div class=\"ft end\">✓ จบ<\/div>\n    <\/div>\n  <\/div>\n\n  <h3 style=\"margin:26px 0 8px;font-size:16px\">สรุปเป็นตาราง<\/h3>\n  <table>\n    <thead><tr><th>ชนิด<\/th><th>การจัดการ<\/th><th>ใครอนุมัติ<\/th><th>คลังทำอะไร<\/th><th>ไปต่อที่ไหน<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>RM/PK<\/td><td>คืนผู้ขาย<\/td><td>QA<\/td><td>ตัดของออก + เลขเอกสาร<\/td><td>เคลมผู้ขาย (เปิดให้เอง)<\/td><\/tr>\n      <tr><td>RM/PK<\/td><td>ขอของทดแทน<\/td><td>QA<\/td><td>ตัดของออก + เลขเอกสาร<\/td><td>เคลมผู้ขาย → ของใหม่เข้า GR<\/td><\/tr>\n      <tr><td>RM/PK<\/td><td>ทำลาย<\/td><td>QA Manager<\/td><td>ตัดของออก + ใบรับรองการทำลาย<\/td><td>จบ<\/td><\/tr>\n      <tr><td>RM/PK<\/td><td>รับแบบมีเงื่อนไข<\/td><td>QA Manager<\/td><td>ย้าย WH-RJ → คลังจัดเก็บ (ทั้ง Lot)<\/td><td>ใช้ผลิตได้<\/td><\/tr>\n      <tr><td>FG<\/td><td>Rework<\/td><td>QA<\/td><td>ตัดของออกจาก WH-FG<\/td><td>ผลิตใหม่ → รับ FG → Lot ใหม่<\/td><\/tr>\n      <tr><td>FG<\/td><td>Reject<\/td><td>QA<\/td><td>ย้ายทั้ง Lot → WH-RJ<\/td><td>กลับคิว Disposition เพื่อทำลาย<\/td><\/tr>\n      <tr><td>FG<\/td><td>ทำลาย<\/td><td>QA Manager<\/td><td>ตัดของออก + ใบรับรองการทำลาย<\/td><td>จบ<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/section>\n\n<!-- ───────────── legend ───────────── -->\n<section id=\"legend\">\n  <h2><span class=\"n\">i<\/span>สีและสถานะ<\/h2>\n  <p class=\"sub\">สีแถบซ้ายของกล่องบอกว่าใครเป็นคนทำ ป้ายสีบอกสถานะของ Lot<\/p>\n  <div class=\"legend\">\n    <span><i class=\"sw\" style=\"background:var(--wh)\"><\/i>คลัง<\/span>\n    <span><i class=\"sw\" style=\"background:var(--qc)\"><\/i>QC<\/span>\n    <span><i class=\"sw\" style=\"background:var(--qa)\"><\/i>QA<\/span>\n    <span><i class=\"sw\" style=\"background:#5b6475\"><\/i>ฝ่ายผลิต<\/span>\n  <\/div>\n  <div class=\"legend\" style=\"margin-top:12px\">\n    <span><span class=\"chip c-pend\">รอตรวจ / รอ QC<\/span><\/span>\n    <span><span class=\"chip c-pass\">QC ผ่าน<\/span> รอ QA ปล่อย<\/span>\n    <span><span class=\"chip c-rel\">ใช้ได้ / ปล่อยแล้ว<\/span><\/span>\n    <span><span class=\"chip c-hold\">Hold<\/span> FG รอตัดสิน<\/span>\n    <span><span class=\"chip c-rj\">ไม่ผ่าน / Reject<\/span> อยู่คลังของเสีย WH-RJ<\/span>\n  <\/div>\n\n  <h3 style=\"margin:22px 0 8px;font-size:16px\">ข้อสังเกต<\/h3>\n  <ul class=\"notes\">\n    <li><b>Rework ไม่ได้สร้างงานให้ฝ่ายผลิตอัตโนมัติ<\/b> — ระบบแค่ตัดของออกจากคลัง ส่วนแผนผลิตรับงาน Rework ได้เฉพาะจาก CR ที่ฝ่ายขายเปิด ระหว่างของออกจากคลังจนถึงตอนรับ FG กลับเข้ามา ระบบจึงไม่ได้ติดตามว่าฝ่ายผลิตรับงานไปแล้วหรือยัง<\/li>\n    <li>ยังไม่ได้ตรวจว่าเมื่อใบตัดสินเสร็จแล้ว NCR ของ Lot ปิดเองหรือต้องปิดด้วยมือ<\/li>\n    <li>ผลตรวจระหว่างผลิต (QC › ตรวจระหว่างผลิต) ไม่ได้ทำให้ Lot เข้าคิว Disposition — คิวรับเฉพาะ Lot ที่ไม่ผ่านตามข้อ 1<\/li>\n  <\/ul>\n<\/section>\n\n<footer>\n  ที่มา: <code>domain/qa_disposition.go<\/code> (ใครตัดสินอะไรได้) · <code>domain/qa_disposition_exec.go<\/code> (คลังทำอะไร) ·\n  <code>domain/fg_lot.go<\/code> + <code>usecase/fg_lot_usecase.go<\/code> (สถานะ FG) · <code>repository/qa_disposition_repository.go<\/code> (เงื่อนไขเข้าคิว)\n<\/footer>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"id": "supplier-claim", "label": "เคลมผู้ขาย", "html": "<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Flow เคลมผู้ขาย (Supplier Claim)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#f6f6f3; --surface:#fff; --surface-2:#f0f0ec; --text:#1c1c1f; --muted:#5f6068; --border:#dddcd6;\n  --qa:#0e7490; --qa-soft:#d8eef3;\n  --qc:#6d3fd1; --qc-soft:#e9e1fb;\n  --wh:#a85a06; --wh-soft:#fbecd6;\n  --pu:#157a3c; --pu-soft:#ddf2e4;\n  --sys:#44464f; --sys-soft:#e6e6e2;\n  --ac:#b42358; --ac-soft:#fbe1ea;\n  --bad:#b42323; --bad-soft:#fbe3e3;\n  --claim:#1d4ed8; --claim-soft:#dfe8fd;\n}\n@media (prefers-color-scheme: dark){\n  :root{\n    --bg:#131315; --surface:#1c1c1f; --surface-2:#232327; --text:#ececee; --muted:#a3a3ad; --border:#34343a;\n    --qa:#3cc4dc; --qa-soft:#123a43; --qc:#a98bfa; --qc-soft:#2c2347; --wh:#f2b449; --wh-soft:#3d2c10;\n    --pu:#4fd07f; --pu-soft:#173826; --sys:#c4c5cc; --sys-soft:#2a2a2f; --ac:#f47aa5; --ac-soft:#40192a;\n    --bad:#f17c7c; --bad-soft:#421f1f; --claim:#7ea6ff; --claim-soft:#1a2747;\n  }\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--text);font:15px/1.6 \"IBM Plex Sans Thai\",\"Leelawadee UI\",Tahoma,system-ui,sans-serif}\nmain{max-width:1320px;margin:0 auto;padding:28px 16px 64px}\nh1{font-size:26px;line-height:1.3;margin:0 0 6px}\nh2{font-size:19px;margin:40px 0 6px}\np.lead{color:var(--muted);margin:0 0 14px;max-width:960px}\n.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:980px}\ncode{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}\n\n/* role chips */\n.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}\n.r{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}\n.r.qa{color:var(--qa);background:var(--qa-soft)}\n.r.qc{color:var(--qc);background:var(--qc-soft)}\n.r.wh{color:var(--wh);background:var(--wh-soft)}\n.r.pu{color:var(--pu);background:var(--pu-soft)}\n.r.sys{color:var(--sys);background:var(--sys-soft)}\n.r.ac{color:var(--ac);background:var(--ac-soft)}\n\n/* big flow */\n.flow{display:grid;grid-template-columns:minmax(0,1.15fr) 44px minmax(0,1fr) 44px minmax(0,1.25fr);align-items:start;margin-top:14px}\n.zone{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}\n.zone>h3{margin:0 0 2px;font-size:16px}\n.zone>.zsub{color:var(--muted);font-size:13px;margin:0 0 12px}\n.zone.claim{border:2px solid var(--claim);background:linear-gradient(var(--claim-soft),var(--surface) 140px)}\n.bigarrow{display:flex;align-items:center;justify-content:center;align-self:stretch;color:var(--muted);font-size:28px}\n.bigarrow span{position:sticky;top:45vh}\n\n.path{border:1px solid var(--border);border-radius:12px;padding:10px 10px 12px;background:var(--surface-2);margin-bottom:12px}\n.path:last-child{margin-bottom:0}\n.path>.ph{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:700;font-size:14.5px}\n.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}\n.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;position:relative}\n.step .t{font-weight:600}\n.step .d{color:var(--muted);font-size:13px;margin-top:2px}\n.step.out{border:2px solid var(--claim);background:var(--claim-soft)}\n.step.out .t{color:var(--claim)}\n.step.stop{border-style:dashed}\n.down{text-align:center;color:var(--muted);line-height:1;font-size:15px;margin:3px 0}\n.menu{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}\n.note{font-size:12.5px;color:var(--muted);margin-top:8px;padding-left:10px;border-left:3px solid var(--border)}\n.note.bad{border-left-color:var(--bad)}\n\n/* claim document parts */\n.part{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px}\n.part .pt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:3px}\n.part ul{margin:2px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}\n.part ul li{margin:1px 0}\n.status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;font-size:13px}\n.st{font-weight:600;padding:1px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}\n.st.p{color:var(--wh);border-color:var(--wh)}\n.st.c{color:var(--pu);border-color:var(--pu)}\n.st.x{color:var(--bad);border-color:var(--bad)}\n\n/* outcomes */\n.lanes{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.lane{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px}\n.lane>.lh{font-weight:700;font-size:14px;margin-bottom:6px}\n.lane .step{padding:6px 8px;font-size:13px}\n.lane .step .d{font-size:12.5px}\n.merge{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 4px}\n.closebox{border:2px solid var(--pu);background:var(--pu-soft);border-radius:10px;padding:9px 11px}\n.closebox .t{font-weight:700;color:var(--pu)}\n.cancelbox{border:1.5px dashed var(--bad);background:var(--bad-soft);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13px}\n.cancelbox .t{font-weight:700;color:var(--bad)}\n.cancelbox ul{margin:3px 0 0;padding-left:18px}\n\n/* tables */\n.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px 0;overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:14px}\nth,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}\ntr:last-child td{border-bottom:none}\nth{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2)}\ntd.y{color:var(--pu);font-weight:700;text-align:center}\ntd.n{color:var(--muted);text-align:center}\nth.c{text-align:center}\n\n.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}\n.where .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}\n.where .card b{display:block;margin-bottom:2px}\n.where .card span{color:var(--muted);font-size:13px}\nfooter{color:var(--muted);font-size:12.5px;margin-top:36px}\n\n@media (max-width:1020px){\n  .flow{grid-template-columns:1fr}\n  .bigarrow{transform:rotate(90deg);height:40px}\n  .bigarrow span{position:static}\n}\n@media (max-width:560px){ .lanes{grid-template-columns:1fr} }\n<\/style>\n<\/head>\n<body>\n<main>\n  <h1>เคลมผู้ขาย — มาจากไหน แล้วไปไหนต่อ<\/h1>\n  <p class=\"lead\">ใบเคลมผู้ขาย (เลข <code>CLM-…<\/code>) ใช้ตามของ RM/PK ที่รับเข้ามาแล้วมีปัญหาจากผู้ขาย มีหน้าเดียวกันสองเมนู:\n    <b>QA › เคลมผู้ขาย<\/b> (เปิด / แก้ข้อมูล / ปิด / ยกเลิก) และ <b>จัดซื้อ › เคลมผู้ขาย<\/b> (กรอกผลติดต่อผู้ขาย)<\/p>\n  <div class=\"legend\">\n    <span class=\"r pu\">จัดซื้อ<\/span><span class=\"r wh\">คลัง<\/span><span class=\"r qc\">QC<\/span><span class=\"r qa\">QA<\/span><span class=\"r sys\">ระบบทำให้เอง<\/span><span class=\"r ac\">บัญชี<\/span>\n  <\/div>\n\n  <h2>ภาพรวม<\/h2>\n  <div class=\"flow\">\n\n    <!-- ── ZONE 1: ต้นทาง ── -->\n    <section class=\"zone\">\n      <h3>① ก่อนเข้าเมนูเคลม<\/h3>\n      <p class=\"zsub\">เคลมเกิดได้ 2 ทาง และทั้งสองทางต้องมี <b>ใบรับเข้า (GR) ที่อ้าง PO<\/b> เป็นต้นทางเสมอ<\/p>\n\n      <div class=\"path\">\n        <div class=\"ph\">ทาง A · ระบบเปิดให้เอง <span class=\"tag\">ปัญหาคุณภาพ<\/span><\/div>\n        <div class=\"step\"><span class=\"r pu\">จัดซื้อ<\/span> <span class=\"t\">ใบสั่งซื้อ (PO)<\/span>\n          <div class=\"menu\">จัดซื้อ › ใบสั่งซื้อ (PO)<\/div><\/div>\n        <div class=\"down\">↓<\/div>\n        <div class=\"step\"><span class=\"r wh\">คลัง<\/span> <span class=\"t\">รับเข้าสินค้า (GR) จาก PO<\/span>\n          <div class=\"d\">ของเข้าพักที่ WH-QZ รอตรวจ<\/div>\n          <div class=\"menu\">คลัง › รับเข้าสินค้า (GR)<\/div><\/div>\n        <div class=\"down\">↓<\/div>\n        <div class=\"step\"><span class=\"r qc\">QC<\/span> <span class=\"t\">ตรวจรับ → “ไม่ผ่าน”<\/span>\n          <div class=\"d\">Lot ย้ายไป WH-RJ ทันที + กระดิ่งแจ้ง QA<\/div>\n          <div class=\"menu\">QC › ตรวจรับ<\/div><\/div>\n        <div class=\"down\">↓<\/div>\n        <div class=\"step\"><span class=\"r qa\">QA<\/span> <span class=\"t\">Disposition เลือก “คืนผู้ขาย” หรือ “ขอของทดแทน”<\/span>\n          <div class=\"d\">สองทางนี้ QA อนุมัติเองได้ ไม่ต้องรอ QA Manager<\/div>\n          <div class=\"menu\">QA › Disposition<\/div><\/div>\n        <div class=\"down\">↓ อนุมัติแล้ว<\/div>\n        <div class=\"step out\"><span class=\"r sys\">ระบบ<\/span> <span class=\"t\">เปิดใบเคลมให้อัตโนมัติ + แจ้งกระดิ่งจัดซื้อ<\/span>\n          <div class=\"d\">ประเภท = คุณภาพ · สิ่งที่ขอ = คืน / เปลี่ยน (ตาม Disposition) · ผู้ขาย, GR, สินค้า, Lot, จำนวน, เหตุผล QC เติมให้ครบ<\/div><\/div>\n        <div class=\"note\">Disposition แบบ “ทำลาย” หรือ “รับแบบมีเงื่อนไข” <b>ไม่เปิดเคลม<\/b> · ถ้าตอนอนุมัติเปิดเคลมพลาด ระบบเปิดซ้ำให้อีกรอบตอนคลังกด “ดำเนินการแล้ว”<\/div>\n      <\/div>\n\n      <div class=\"path\">\n        <div class=\"ph\">ทาง B · QA เปิดเองจากบรรทัด GR <span class=\"tag\">ขาดส่ง / เสียหาย<\/span><\/div>\n        <div class=\"step\"><span class=\"r wh\">คลัง<\/span> <span class=\"t\">รับเข้าสินค้า (GR) จาก PO<\/span><\/div>\n        <div class=\"down\">↓<\/div>\n        <div class=\"step\"><span class=\"r qa\">QA<\/span> <span class=\"t\">เปิดหน้ารายละเอียด GR → ปุ่ม “เปิดเคลม” ที่บรรทัด<\/span>\n          <div class=\"d\">หรือกด “เปิดเคลมจากใบรับเข้า” บนหน้า QA › เคลมผู้ขาย ซึ่งพาไปหน้ารายการ GR · ปุ่มโชว์เฉพาะคนที่มีสิทธิ์ QA จัดการ<\/div>\n          <div class=\"menu\">คลัง › รับเข้าสินค้า (GR) › บรรทัด<\/div><\/div>\n        <div class=\"down\">↓<\/div>\n        <div class=\"step out\"><span class=\"r qa\">QA<\/span> <span class=\"t\">ฟอร์มเปิดเคลม → บันทึก<\/span>\n          <div class=\"d\"><b>ขาดส่ง<\/b> — สั่งมากกว่ารับ · เคลมได้ไม่เกิน (สั่ง − รับ − ที่เคลมขาดส่งไปแล้ว)<br>\n            <b>เสียหาย<\/b> — เคลมได้ไม่เกิน (ยอดรับ − ที่เคลมเสียหาย/คุณภาพไปแล้ว)<br>\n            ผู้ขาย / สินค้า / Lot ดึงจากบรรทัด GR แก้ไม่ได้ · ระบบแจ้งกระดิ่งจัดซื้อ<\/div>\n          <div class=\"menu\">/qa/claims/create?grLineId=…<\/div><\/div>\n        <div class=\"note bad\">ปัญหา <b>คุณภาพ (QC ไม่ผ่าน)<\/b> เปิดเองไม่ได้ — ต้องไปทาง A ผ่าน Disposition เท่านั้น<\/div>\n      <\/div>\n    <\/section>\n\n    <div class=\"bigarrow\" aria-hidden=\"true\"><span>→<\/span><\/div>\n\n    <!-- ── ZONE 2: ใบเคลม ── -->\n    <section class=\"zone claim\">\n      <h3>② ใบเคลม CLM<\/h3>\n      <p class=\"zsub\">ใบเดียว แบ่ง 3 ส่วนตามคนรับผิดชอบ<\/p>\n      <div class=\"status\">สถานะ: <span class=\"st p\">รอดำเนินการ<\/span> → <span class=\"st c\">เสร็จสิ้น<\/span> หรือ <span class=\"st x\">ยกเลิก<\/span><\/div>\n\n      <div class=\"part\">\n        <div class=\"pt\"><span class=\"r qa\">QA<\/span> ส่วนที่ 1 · ข้อมูลเคลม<\/div>\n        <ul>\n          <li>รายละเอียดปัญหา, ผล QC, สิ่งที่ขอจากผู้ขาย (คืน / เปลี่ยน / เครดิต / พักไว้ — ขาดส่งไม่มี “คืน”)<\/li>\n          <li>กำหนดได้คำตอบ: ตั้งต้น +7 วัน, เลื่อนได้ไม่เกิน 90 วันนับจากวันเปิด<\/li>\n          <li>อ้างอิง NCR ที่มีอยู่ หรือกด “สร้าง NCR จากเคลมนี้”<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"part\">\n        <div class=\"pt\"><span class=\"r pu\">จัดซื้อ<\/span> ส่วนที่ 2 · ผลติดต่อผู้ขาย <span class=\"tag\">QA กรอกแทนได้<\/span><\/div>\n        <ul>\n          <li>คำตอบผู้ขาย + วันที่ตอบ, ผู้ขายรับข้อเสนอไหม, ยอดเครดิตที่ตกลง<\/li>\n          <li>จัดซื้อเข้าทาง <b>จัดซื้อ › เคลมผู้ขาย<\/b> (ตัวกรอง “รอคำตอบผู้ขาย”) หรือจากกระดิ่ง “มีเคลมใหม่”<\/li>\n          <li>ไม่ได้คำตอบเกินกำหนด = ขึ้น <b>เกิน SLA<\/b> (ตัวกรอง + แดชบอร์ด QA)<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"part\">\n        <div class=\"pt\"><span class=\"r sys\">ระบบ<\/span> ส่วนที่ 3 · ผลดำเนินการ<\/div>\n        <ul>\n          <li>ส่งคืนแล้ว (วันที่ + เลขอ้างอิง) · ได้ของทดแทน (GR ใบไหน) · Credit Note (เลข CRN + ยอด)<\/li>\n          <li>เติมเองจากงานของคลัง / QC / Credit Note — ดูช่อง ③ · ใบที่ QA เปิดเอง (ทาง B) QA กรอกวันที่ส่งคืนเองได้<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"note\">ทุกการเปลี่ยนแปลงขึ้นไทม์ไลน์ของใบ · พิมพ์ / PDF ได้ที่ <code>/print/claims/:id<\/code><\/div>\n    <\/section>\n\n    <div class=\"bigarrow\" aria-hidden=\"true\"><span>→<\/span><\/div>\n\n    <!-- ── ZONE 3: ปลายทาง ── -->\n    <section class=\"zone\">\n      <h3>③ เคลมแล้วไปไหนต่อ<\/h3>\n      <p class=\"zsub\">แยกตาม “สิ่งที่ขอจากผู้ขาย” แล้วกลับมาปิดที่ใบเคลม<\/p>\n      <div class=\"lanes\">\n        <div class=\"lane\">\n          <div class=\"lh\">คืน<\/div>\n          <div class=\"step\"><span class=\"r wh\">คลัง<\/span> <span class=\"t\">งานจาก QA → “ดำเนินการแล้ว”<\/span>\n            <div class=\"d\">ตัดสต๊อกออกจาก WH-RJ · เคลมขึ้น “ส่งคืนแล้ว” ให้เอง<\/div>\n            <div class=\"menu\">คลัง › งานจาก QA<\/div><\/div>\n          <div class=\"note\">ใบเปิดเอง: QA กรอกวันที่ส่งคืนในใบเคลม<\/div>\n        <\/div>\n        <div class=\"lane\">\n          <div class=\"lh\">เปลี่ยน<\/div>\n          <div class=\"step\"><span class=\"r wh\">คลัง<\/span> <span class=\"t\">ส่งของเดิมคืน<\/span>\n            <div class=\"d\">เหมือนช่อง “คืน” (ขาดส่งข้ามขั้นนี้)<\/div><\/div>\n          <div class=\"down\">↓<\/div>\n          <div class=\"step\"><span class=\"r wh\">คลัง<\/span> <span class=\"t\">GR ใหม่จาก PO เดิม<\/span>\n            <div class=\"d\">ที่บรรทัดเลือก “ของทดแทนจากเคลม”<\/div><\/div>\n          <div class=\"down\">↓<\/div>\n          <div class=\"step\"><span class=\"r qc\">QC<\/span> <span class=\"t\">ตรวจรับของทดแทน<\/span>\n            <div class=\"d\">ตัดสินแล้ว (ผ่านหรือไม่ผ่าน) = เคลมขึ้น “ได้รับของทดแทนแล้ว”<\/div><\/div>\n        <\/div>\n        <div class=\"lane\">\n          <div class=\"lh\">เครดิต<\/div>\n          <div class=\"step\"><span class=\"r qa\">QA<\/span>/<span class=\"r pu\">จัดซื้อ<\/span> <span class=\"t\">บันทึก Credit Note จากเคลม<\/span>\n            <div class=\"d\">ยอดต้องไม่เกินเครดิตที่ตกลง · เคลมผูกเลข CRN<\/div><\/div>\n          <div class=\"down\">↓<\/div>\n          <div class=\"step\"><span class=\"r ac\">บัญชี<\/span> <span class=\"t\">คีย์ใน PEAK เอง<\/span>\n            <div class=\"d\">ERP บันทึกอย่างเดียว ไม่ส่ง PEAK<\/div><\/div>\n        <\/div>\n        <div class=\"lane\">\n          <div class=\"lh\">พักไว้<\/div>\n          <div class=\"step\"><span class=\"t\">ไม่มีงานต่อ<\/span>\n            <div class=\"d\">ขอแค่มีคำตอบผู้ขายก็ปิดได้<\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"merge\">↓ ครบตามที่ขอแล้ว<\/div>\n      <div class=\"closebox\">\n        <span class=\"r qa\">QA<\/span> <span class=\"t\">กด “ปิดเคลม” → เสร็จสิ้น<\/span>\n        <div class=\"d\" style=\"font-size:13px;color:var(--muted)\">ยังไม่ครบ ระบบไม่ให้ปิด และบอกว่าติดอะไร (ตารางด้านล่าง) · ปิดได้ทั้ง QA และหัวหน้า QA<\/div>\n      <\/div>\n      <div class=\"cancelbox\">\n        <span class=\"t\">ทางยกเลิก<\/span>\n        <ul>\n          <li><span class=\"r qa\">QA<\/span> ยกเลิกเอง ต้องใส่เหตุผล — ยกเลิกไม่ได้ถ้ายังผูก Credit Note อยู่ หรือมี GR ของทดแทนที่รอ QC<\/li>\n          <li><span class=\"r sys\">ระบบ<\/span> ยกเลิกตามเมื่อ Disposition ต้นทางถูกยกเลิก — เฉพาะเคลมที่ผู้ขายยังไม่มีความคืบหน้า ถ้ามีแล้ว ระบบไม่ให้ยกเลิก Disposition<\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <h2>ปิดเคลมได้เมื่อไร<\/h2>\n  <p class=\"sub\">ระบบเช็คตาม “สิ่งที่ขอจากผู้ขาย” — ช่องที่ติ๊กคือสิ่งที่ต้องมีก่อนกด “ปิดเคลม”<\/p>\n  <div class=\"panel\">\n    <table>\n      <thead><tr><th>สิ่งที่ขอ<\/th><th class=\"c\">คำตอบผู้ขาย<\/th><th class=\"c\">ส่งของคืนแล้ว<\/th><th class=\"c\">ได้ของทดแทน (มี GR)<\/th><th class=\"c\">มี Credit Note<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><b>คืน<\/b><\/td><td class=\"y\">✓<\/td><td class=\"y\">✓<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr>\n        <tr><td><b>เปลี่ยน<\/b><\/td><td class=\"y\">✓<\/td><td class=\"y\">✓ <span style=\"font-weight:400;color:var(--muted)\">(ขาดส่งไม่ต้อง)<\/span><\/td><td class=\"y\">✓<\/td><td class=\"n\">—<\/td><\/tr>\n        <tr><td><b>เครดิต<\/b><\/td><td class=\"y\">✓<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"y\">✓<\/td><\/tr>\n        <tr><td><b>พักไว้<\/b><\/td><td class=\"y\">✓<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n  <\/div>\n\n  <h2>เคลมไปโผล่ที่ไหนอีก<\/h2>\n  <p class=\"sub\">ใบเคลมใบเดียวกันมีลิงก์ / ป้ายสถานะแสดงในหน้าอื่น ๆ เหล่านี้<\/p>\n  <div class=\"where\">\n    <div class=\"card\"><b>จัดซื้อ › ใบสั่งซื้อ (PO)<\/b><span>ป้ายเคลมที่บรรทัด PO คำนวณจากใบเคลม: รอผลเคลม · ได้ของทดแทนแล้ว · ได้เครดิตแล้ว · ปิดเคลมแล้ว (แก้มือไม่ได้)<\/span><\/div>\n    <div class=\"card\"><b>คลัง › รับเข้าสินค้า (GR)<\/b><span>บรรทัดต้นทางมีปุ่ม “เปิดเคลม” (ทาง B) · บรรทัดของทดแทนแสดง “ของทดแทนจากเคลม CLM-…” ลิงก์ไปใบเคลม<\/span><\/div>\n    <div class=\"card\"><b>QA › Disposition<\/b><span>ใบคืนผู้ขาย / ขอของทดแทนที่อนุมัติแล้ว มีลิงก์ไปใบเคลมที่เปิดให้<\/span><\/div>\n    <div class=\"card\"><b>QC › ของไม่ผ่าน (NC)<\/b><span>Lot ที่ไม่ผ่านแสดงเลข CLM ที่เกี่ยวข้อง<\/span><\/div>\n    <div class=\"card\"><b>QA › NCR<\/b><span>เคลมอ้างอิง NCR ได้ 1 ใบ หรือสร้าง NCR ใหม่จากเคลม (ข้อมูลผู้ขาย / Lot / จำนวนเติมให้)<\/span><\/div>\n    <div class=\"card\"><b>แดชบอร์ด QA + กระดิ่ง<\/b><span>ตัวเลขเคลมรอดำเนินการ / เกิน SLA · กระดิ่งจัดซื้อเด้งทุกครั้งที่มีเคลมใหม่<\/span><\/div>\n  <\/div>\n\n  <footer>อ้างอิงโค้ด ณ 2 พ.ย. 2569: <code>apps/api/internal/domain/qa_claim.go<\/code> · <code>usecase/supplier_claim_usecase.go<\/code> · <code>usecase/qa_task_usecase.go<\/code> · <code>repository/gr_replacement_claim.go<\/code> · <code>domain/qa_claim_po.go<\/code> · <code>domain/qa_credit_note.go<\/code><\/footer>\n<\/main>\n<\/body>\n<\/html>\n"}];
const view = document.getElementById('view');
function show() {
  const id = location.hash.slice(1);
  const page = PAGES.find(p => p.id === id) || PAGES[0];
  view.srcdoc = page.html;
  document.title = page.label + ' — BioSierra ERP Flow';
  document.querySelectorAll('nav a').forEach(a => {
    if (a.dataset.id === page.id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}
window.addEventListener('hashchange', show);
show();
</script>
